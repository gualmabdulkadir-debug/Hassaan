 async place(){
  const ad=$("#ad")?.value.trim()||"",ph=$("#ph")?.value.trim()\vert{}\vert{}"",rn=$("#rn")?.value.trim()||me.name||"",pn=$("#pn")?.value.trim()\vert{}\vert{}"271124",ct=$("#ct")?.value.trim()||"गोंडा";
  if(!ad||!ph||!rn)return alert("नाम, पता और फ़ोन भरें");if(me.lat==null)return alert("पहले 📍 मेरी लोकेशन दबाएँ");
  const G=split(cart().map(id=>D.products.find(p=>p.id==id)).filter(Boolean));if(G.some(g=>g.df==null))return alert("किसी दुकान की लोकेशन नहीं है");if(G.some(g=>g.out))return alert("कुछ दुकानें "+F.maxKm+" किमी की सीमा से बाहर हैं, उन्हें कार्ट से हटाएँ");if(SITE.open===false)return alert(SITE.closedMsg||"अभी ऑर्डर बंद हैं");
  await updateDoc(doc(db,"users",me.id),{address:ad,phone:ph,pin:pn,city:ct,rname:rn});me.address=ad;me.phone=ph;me.pin=pn;me.city=ct;me.rname=rn;
  const tx="HDP"+Date.now();let tot=0;for(const g of G){tot+=g.t+g.pf+g.df+g.cf;await addDoc(collection(db,"orders"),{customerId:me.id,name:me.name,rname:rn,addr:ad,city:ct,pin:pn,phone:ph,lat:me.lat,lng:me.lng,sellerId:g.l[0].sellerId,sellerName:g.l[0].sellerName,items:g.l.map(p=>({pid:p.id,name:p.name,price:p.price})),itemsTotal:g.t,platformFee:g.pf,deliveryFee:g.df,km:+g.k.toFixed(1),etaMin:g.eta,total:g.t+g.pf+g.df+g.cf,payment:pm,codFee:g.cf,paid:false,txnid:tx,status:"placed",boyId:null,boyName:"",createdAt:serverTimestamp()})}
  setCart([]);if(pm=="online")return payNow(tx,tot);alert("ऑर्डर हो गया ✅")},

 paid(d){return updateDoc(doc(db,"orders",d.id),{paid:true})}

 const fm=document.createElement("form");fm.method="POST";fm.action=r.action;for(const[k,v]of Object.entries(r.fields)){const i=document.createElement("input");i.type="hidden";i.name=k;i.value=v;fm.appendChild(i)}document.body.appendChild(fm);fm.submit()}
