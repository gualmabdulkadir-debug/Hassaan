 <!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hassaan Digital Point</title>
<style>
:root{--bg:#f1f3f6;--cd:#fff;--tx:#212121;--mu:#878787;--ac:#2874f0;--bd:#e8e1d6;--ok:#2b8a3e;--bad:#c92a2a}
@media(prefers-color-scheme:dark){:root{--bg:#17140f;--cd:#221e17;--tx:#f3ede3;--mu:#a59d8f;--bd:#373126;--ac:#4d8ff5}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans Devanagari",sans-serif}
header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--ac);color:#fff;position:sticky;top:0;z-index:5}
main{padding:0 16px 40px;max-width:1000px;margin:auto}a{color:var(--ac);cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px}
.em{font-size:42px;text-align:center}.pr{font-weight:700;color:var(--ac)}.mu{color:var(--mu);font-size:13px}
button{border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px;border:0}
.b{background:var(--ac);color:#fff}.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}.r{background:var(--bad);color:#fff}
input,select{padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--cd);color:var(--tx);font-size:14px;max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;background:var(--bd)}.ok{background:var(--ok);color:#fff}.bad{background:var(--bad);color:#fff}
h2{font-size:17px;margin:18px 0 8px}.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}.st b{font-size:22px;display:block}
header .g{color:#fff;border-color:#ffffff99}
.y{background:#ff9f00;color:#fff}.o{background:#fb641b;color:#fff}.y,.o{font-size:15px;padding:12px 18px;flex:1}.off{color:#388e3c;font-weight:600;font-size:13px}
.pd{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.big img{width:100%;max-height:380px;object-fit:contain}
.th{width:56px;height:56px;object-fit:cover;border:2px solid var(--bd);border-radius:6px;cursor:pointer}.th.on{border-color:var(--ac)}
.gi{width:100%;height:150px;object-fit:contain}.t2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;margin:6px 0}.card[data-a]{cursor:pointer}
</style></head><body>
<header><b id="ttl">🛍️ Hassaan Digital Point</b><span id="who"></span></header><div id="bn" style="max-width:1000px;margin:auto;padding:0 16px"></div><main id="app"><p class="mu">⏳ लोड हो रहा है…</p></main><footer id="ft" class="mu" style="text-align:center;padding:20px"></footer>

<script type="module">
import{initializeApp,deleteApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,onAuthStateChanged,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,addDoc,collection,query,where,orderBy,limit,onSnapshot,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const cfg={apiKey:"AIzaSyCWrKkSmgPXDt6KL7FNyMLZeI6kXd4ukU0",authDomain:"hassaan-s.firebaseapp.com",projectId:"hassaan-s",storageBucket:"hassaan-s.firebasestorage.app",messagingSenderId:"12302351650",appId:"1:12302351650:web:6c5a5c4ced2b210f79397b"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ST={placed:"नया",self:"सेलर खुद पहुँचा रहा",needboy:"डिलीवरी बॉय चाहिए",arrived:"पहुँच गया",assigned:"असाइन",picked:"रास्ते में",delivered:"डिलीवर हुआ",cancelled:"रद्द"};

let seen={},me={role:"customer",id:"guest",name:"ग्राहक"},subs=[],D={products:[],orders:[],users:[],hist:[]},sq="",creating=false,showLogin=false;
const cart=()=>JSON.parse(localStorage["c_"+me.id]||"[]"),setCart=a=>{localStorage["c_"+me.id]=JSON.stringify(a);render()};
const sorted=a=>[...a].sort((x,y)=>(y.createdAt?.seconds||9e9)-(x.createdAt?.seconds||9e9));

function sub(q,k){subs.push(onSnapshot(q,s=>{seen[k]=1;D[k]=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>console.error(k,e)))}

function render(){
 if(showLogin){loginV();return}
 $("#who").innerHTML=me.id=="guest"?`<button class=g data-a=openlogin>🔑 लॉगिन</button>`:`${esc(me.name)} (${{customer:"ग्राहक",admin:"एडमिन",seller:"सेलर",delivery:"डिलीवरी"}[me.role]}) <button class=g data-a=out>लॉगआउट</button>`;
 $("#app").innerHTML={customer:vC,admin:vA,seller:vS,delivery:vD}[me.role]();
}

function loginV(){
 $("#who").innerHTML=`<button class=g data-a=closelogin>← दुकान पर वापस</button>`;
 $("#app").innerHTML=`<div class=card style="max-width:380px;margin:20px auto"><h2>लॉगिन / साइनअप</h2><div class=row><input id=nm placeholder="नाम (नए ग्राहक के लिए)"></div><div class=row><input id=em placeholder="ईमेल"></div><div class=row><input id=pw type=password placeholder="पासवर्ड (कम से कम 6 अक्षर)"></div><div class=row><button class=b data-a=login>लॉगिन</button><button class=g data-a=reg>नया अकाउंट बनाएँ</button></div></div>`;
}
 function vC(){
 const cp=D.products.find(p=>p.id==cur);if(cp)return vP(cp);
 const ps=D.products.filter(p=>(p.name||p.title||"").toLowerCase().includes(sq.toLowerCase())),
 C=cart().map(id=>D.products.find(p=>p.id==id)).filter(Boolean);
 return `${SITE.open===false?`<div class=card>⛔ ${esc(SITE.closedMsg||"अभी ऑर्डर बंद हैं")}</div>`:""}
 <div class=row><input id=sq value="${esc(sq)}" placeholder="सामान खोजें..." style="flex:1"><button class=b data-a=search>खोजें</button></div>
 <h2>🛍️ सभी सामान (Firebase Store)</h2>
 <div class=grid>${ps.map(p=>{const off=p.mrp>p.price?Math.round((p.mrp-p.price)*100/p.mrp):0;return`<div class=card data-a=view data-id=${p.id}>${p.imgs?.[0]?`<img class=gi src="${p.imgs[0]}">`:`<div class=em>${esc(p.emoji||"📦")}</div>`}<div class=t2><b>${esc(p.name||p.title||"सामान")}</b></div><div><b>₹${p.price\vert{}\vert{}p.Price\vert{}\vert{}0}</b>${off?`<s class=mu>₹${p.mrp}</s> <span class=off>${off}% off</span>`:""}</div><div class=mu>${esc(p.sellerName||"विक्रेता")}</div></div>`}).join("")||'<p class=mu>अभी कोई सामान नहीं मिला या लोड हो रहा है...</p>'}</div>
 <h2 id=cartbox>🧺 कार्ट (${C.length})</h2>
 <div class=card>${C.map((p,i)=>`<div class=row>${esc(p.emoji\vert{}\vert{}"📦")} ${esc(p.name||p.title)} — <b>₹${p.price\vert{}\vert{}p.Price\vert{}\vert{}0}</b> <button class=g data-a=rm data-i=${i}>हटाएँ</button></div>`).join("")||'<span class=mu>कार्ट खाली है</span>'}
 ${C.length?`<hr><b>कुल: ₹${C.reduce((a,b)=>a+(b.price||b.Price||0),0)}</b>
 <h3>डिलीवरी का पता:</h3>
 <div class=row><input id=rn placeholder="नाम *" value="${esc(me.rname||me.name||"")}"><input id=ph placeholder="मोबाइल नंबर *" value="${esc(me.phone||"")}"><input id=pn placeholder="पिन कोड *" value="${esc(me.pin||"")}"></div>
 <div class=row><input id=ad placeholder="पूरा पता (मकान नंबर, गली) *" value="${esc(me.address||"")}"><input id=ct placeholder="शहर *" value="${esc(me.city||"")}"></div>
 <div class=row><button class=o data-a=place style="width:100%">ऑर्डर करें (कैश ऑन डिलीवरी)</button></div>`:""}</div>`;
}

function vP(p){
 const im=p.imgs||[];
 return`<button class=g data-a=back>← वापस</button><div class="card pd" style="margin-top:10px"><div><div class=big>${im[0]?`<img src="${im[0]}">`:`<div class=em>${esc(p.emoji||"📦")}</div>`}</div></div>
 <div><h2 style="margin-top:0">${esc(p.name||p.title)}</h2><div class=mu>विक्रेता: ${esc(p.sellerName||"सेलर")}</div><div style="font-size:26px;font-weight:700;color:var(--ac)">₹${p.price||p.Price||0}</div>
 <div class=row><button class=y data-a=add data-id=${p.id}>🛒 कार्ट में जोड़ें</button></div><p>${esc(p.desc||p.description||"")}</p></div></div>`;
}

function vS(){
 return`<h2>सेलर डैशबोर्ड</h2>
 <div class=card><h3>नया प्रोडक्ट जोड़ें</h3>
 <div class=row><input id=pn2 placeholder="प्रोडक्ट का नाम *"><input id=pp type=number placeholder="कीमत ₹ *"></div>
 <div class=row><input id=pe placeholder="इमोजी (e.g. 📱, 👕)"><input id=pd placeholder="विवरण"></div>
 <button class=b data-a=addp style="margin-top:8px">प्रोडक्ट भेजें</button></div>
 <h3>आपके प्रोडक्ट्स</h3>
 <div class=card>${D.products.filter(p=>p.sellerId==me.id).map(p=>`<div class=row>${esc(p.emoji||"📦")} ${esc(p.name\vert{}\vert{}p.title)} - ₹${p.price||p.Price}</div>`).join("")||'<p class=mu>कोई प्रोडक्ट नहीं जुड़ा है</p>'}</div>`;
}

function vA(){return`<h2>एडमिन पैनल</h2><div class=card>कुल प्रोडक्ट्स: ${D.products.length}</div>`;}
function vD(){return`<h2>डिलीवरी पैनल</h2><div class=card>असाइन किए गए ऑर्डर दिखेंगे</div>`;}

const A={
 async login(){
  try{
   const u=await signInWithEmailAndPassword(auth,$("#em").value.trim(),$("#pw").value);
   const s=await getDoc(doc(db,"users",u.user.uid));
   if(s.exists()){me={id:u.user.uid,...s.data()};showLogin=false;boot(u.user)}
   else alert("अकाउंट रिकॉर्ड नहीं मिला");
  }catch(e){alert("लॉगिन में गलती: "+e.message)}
 },
 async reg(){
  const n=$("#nm").value.trim(),e=$("#em").value.trim(),p=$("#pw").value;
  if(!n||!e||!p)return alert("सब जानकारी भरें!");
  creating=true;
  try{
   const c=await createUserWithEmailAndPassword(auth,e,p);
   await setDoc(doc(db,"users",c.user.uid),{name:n,email:e,role:"customer",status:"active",createdAt:serverTimestamp()});
   creating=false;showLogin=false;boot(c.user);
  }catch(x){alert(x.message);creating=false;}
 },
 openlogin(){showLogin=true;render()},
 closelogin(){showLogin=false;render()},
 out(){signOut(auth);me={role:"customer",id:"guest",name:"ग्राहक"};render()},
 search(){sq=$("#sq")?.value.trim()||"";render()},
 view(d){cur=d.id;render()},
 back(){cur=null;render()},
 add(d){cur=null;setCart([...cart(),d.id]);alert("कार्ट में जोड़ दिया गया ✅")},
 rm(d){const c=cart();c.splice(+d.i,1);setCart(c)},
 async place(){
  const rn=$("#rn")?.value.trim()||me.name,ph=$("#ph")?.value.trim()\vert{}\vert{}"",ad=$("#ad")?.value.trim()||"",pn=$("#pn")?.value.trim()\vert{}\vert{}"",ct=$("#ct")?.value.trim()||"";
  if(!ad||!ph)return alert("नाम, पता और फ़ोन नंबर ज़रूर भरें!");
  const C=cart().map(id=>D.products.find(p=>p.id==id)).filter(Boolean);
  await addDoc(collection(db,"orders"),{
   customerId:me.id,name:rn,phone:ph,addr:ad,pin:pn,city:ct,
   items:C.map(p=>({name:p.name||p.title,price:p.price||p.Price})),
   total:C.reduce((a,b)=>a+(b.price||b.Price||0),0),status:"placed",createdAt:serverTimestamp()
  });
  setCart([]);alert("ऑर्डर सफलतापूर्वक हो गया! ✅");
 },
 async addp(){
  const n=$("#pn2").value.trim(),p=+$("#pp").value,e=$("#pe").value.trim()\vert{}\vert{}"📦",d=$("#pd").value.trim();
  if(!n||!p)return alert("नाम और कीमत ज़रूर भरें!");
  await addDoc(collection(db,"products"),{
   name:n,price:p,emoji:e,desc:d,sellerId:me.id,sellerName:me.name,status:"approved",createdAt:serverTimestamp()
  });
  alert("प्रोडक्ट जोड़ दिया गया! ✅");render();
 }
};

document.addEventListener("click",async e=>{
 const b=e.target.closest("[data-a]");
 if(!b)return;
 try{await A[b.dataset.a](b.dataset)}catch(x){alert(x.message)}
});

function boot(u){
 sub(collection(db,"products"),"products");
 if(u&&u.uid!="guest"){
  sub(query(collection(db,"orders"),where("customerId","==",u.uid)),"orders");
 }
 render();
}

onAuthStateChanged(auth,u=>{
 subs.forEach(f=>f());subs=[];
 if(u&&!creating){
  getDoc(doc(db,"users",u.uid)).then(s=>{
   if(s.exists()){me={id:u.uid,...s.data()};boot(u)}
   else boot({uid:"guest"});
  });
 }else{
  me={role:"customer",id:"guest",name:"ग्राहक"};
  boot({uid:"guest"});
 }
});
</script></body></html>
