<script type="module">

 return`<button class=g data-a=back>← वापस</button><div class="card pd"><div><div class=big>${im[window.gi]?`<img src="${im[window.gi]}">`:`<div class=em>${window.esc(p.emoji||"📦")}</div>`}</div><div class=row>${im.map((x,i)=>`<img class="th ${i==window.gi?"on":""}" src="${x}" data-a=gal data-i=${i}>`).join("")}</div></div>

window.vT=function(o){

 return Object.values(g).map(l=>{
  const t=l.reduce((a,p)=>a+(p.price||p.Price||0),0);
  return{l,t,pf:Math.round(t*window.F.pct/100),df:window.F.min,cf:window.pm=="cod"?window.F.cod:0};
 });
