 $("items").innerHTML=l.map(i=>`<div class="row"><span>${E(i.name)} × ${i.q}</span><b>₹${i.price*i.q}</b></div>`).join("")||"Your cart is empty";
 $("tot").innerHTML=`Subtotal: ₹${sub}<br>Delivery: ${l.length?(fee?"₹"+fee:"FREE 🎉"):"-"}<br><b>Total: ₹${sub+fee}</b>${ETA&&l.length?`<br><small>🕒 Delivery in ~${ETA} min</small>`:""}${sv?`<br><small style="color:var(--g)">You save: ₹${sv}</small>`:""}`}
document.addEventListener("click",e=>{const ds0=e.target.dataset;if(ds0.x){closeP();return}if(ds0.g!=null){PI=+ds0.g;pdraw();return}const pc=e.target.closest("[data-p]");if(pc&&!e.target.closest("button")){openP(pc.dataset.p);return}const od=e.target.closest("[data-o]");if(od){OPEN.has(od.dataset.o)?OPEN.delete(od.dataset.o):OPEN.add(od.dataset.o);ro();return}const v=e.target.closest("[data-v]");if(v){if(v.dataset.v=="h"){cat="";$("q").value=""}go(v.dataset.v)}
 const c=e.target.closest("[data-c]");if(c){cat=c.dataset.c;$("q").value="";go("h")}
 const d=e.target.dataset;if(d.n){const p=P.find(x=>x.id==d.n);IDX[d.n]=((IDX[d.n]||0)+1)%pics(p).length}
 if(d.a){if(!uid){needLogin(d.a);return}const p=P.find(x=>x.id==d.a);const c0=cart[p.id]?cart[p.id].q:0;if(p.qty!=null&&c0>=p.qty){toast("Only "+p.qty+" in stock");return}cart[p.id]=cart[p.id]||{...p,q:0};cart[p.id].q++}
 if(d.m){if(--cart[d.m].q<=0)delete cart[d.m]}draw();drawCart();if(PDID)pdraw()});
$("q").oninput=()=>{go("h");draw()};
window.place=async()=>{const items=Object.values(cart).map(i=>({id:i.id,name:i.name,price:i.price,q:i.q}));const sub=items.reduce((a,b)=>a+b.price*b.q,0);
 if(!uid){location.href="login.html";return}
 const phn=ph10($("ph").value);if(!items.length||!$("nm").value||!phn||!$("ad").value)return alert(!phn?"Please enter a valid 10-digit mobile number (required)":"Please fill in your cart, name and address");
 if(!LOC&&!confirm("You have not shared your location. Place the order without it?"))return;
 if("Notification"in window)Notification.requestPermission();
 try{await addDoc(collection(db,"orders"),{uid,name:$("nm").value,phone:phn,address:$("ad").value,loc:LOC,eta:ETA,items,subtotal:sub,fee:fe(sub),total:sub+fe(sub),status:"Placed",createdAt:serverTimestamp()});
 cart={};draw();drawCart();go("o");toast("Order placed ✅")}catch(e){alert("Order failed: "+e.message)}};
function acc(){const u=auth.currentUser;
 $("acc").innerHTML=u?`<div class="row"><span>✅ <b>${E(u.displayName||"Customer")}</b><br><small>${E(u.email)}</small></span><button onclick="logout()">Logout</button></div>`:`<div class="row"><span>👤 You are not logged in<br><small>Log in or sign up to place orders</small></span><button class="btn" onclick="login()">Login / Sign up</button></div>`;
 $("pbox").style.display=u?"block":"none"}
window.login=()=>{location.href="login.html"};
window.gl=()=>{if(!navigator.geolocation)return alert("Location is not supported on this device");$("lt").textContent="Finding your location...";
 navigator.geolocation.getCurrentPosition(async p=>{LOC={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)};
  $("lt").textContent=`✅ Location found (±${LOC.acc} m)`;
  $("lm").innerHTML=`<iframe loading="lazy" style="width:100%;height:180px;border:0;border-radius:12px;margin-top:8px" src="https://www.openstreetmap.org/export/embed.html?bbox=${LOC.lng-.004},${LOC.lat-.003},${LOC.lng+.004},${LOC.lat+.003}&layer=mapnik&marker=${LOC.lat},${LOC.lng}"></iframe>`;
  if(!$("ad").value.trim()){try{const j=await(await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${LOC.lat}&lon=${LOC.lng}`)).json();if(j.display_name)$("ad").value=j.display_name}catch(e){}}
  },()=>{$("lt").textContent="";alert("Could not get location. Please allow location permission in your browser")},{enableHighAccuracy:true,timeout:15000})};
window.pushOn=async q=>{const A=q?()=>{}:alert;try{if(!uid)return A("Please log in first");if(!VAPID||/PASTE/.test(VAPID))return A("Push notifications are not set up yet");
 if(!(await isSupported()))return A("Push is not supported in this browser. On iPhone, add the app to your Home Screen first");
 if(await Notification.requestPermission()!=="granted")return A("Please allow notification permission");
 const reg=await navigator.serviceWorker.ready,m=getMessaging(app),tk=await getToken(m,{vapidKey:VAPID,serviceWorkerRegistration:reg});
 await setDoc(doc(db,"tokens",tk),{uid,t:serverTimestamp()});if(!fgOn){fgOn=1;onMessage(m,p=>toast((p.notification?.title||"")+": "+(p.notification?.body||"")))}$("pst").textContent="✅ Enabled"}catch(e){A("Push error: "+e.message)}};
let DP=null;const std=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
const showI=t=>{try{if(std||localStorage.noinst)return}catch(e){}$("itx").textContent=t;$("inst").style.display="flex"};
addEventListener("beforeinstallprompt",e=>{e.preventDefault();DP=e;showI("📲 Install our Lulu Kit Store app — it will be added to your home screen")});
$("ib").onclick=async()=>{if(DP){DP.prompt();await DP.userChoice;DP=null;$("inst").style.display="none"}else alert("Open the browser menu (⋮ or Share ⬆️) and tap 'Add to Home screen'")};
$("ix").onclick=()=>{$("inst").style.display="none";try{localStorage.noinst=1}catch(e){}};
addEventListener("appinstalled",()=>$("inst").style.display="none");
if(/iphone|ipad/i.test(navigator.userAgent)&&!std)showI("📲 iPhone: tap Share ⬆️ → 'Add to Home Screen'");
if("serviceWorker"in navigator)navigator.serviceWorker.register("firebase-messaging-sw.js").catch(()=>{});
window.logout=()=>signOut(auth);
window.sp=async()=>{const phn=ph10($("pph").value);if(!phn)return alert("Please enter a valid 10-digit mobile number (required)");const d={name:$("pn").value,phone:phn,address:$("pad").value};try{await setDoc(doc(db,"users",uid),d,{merge:true});toast("Profile saved ✅")}catch(e){alert("Save failed: "+e.message)}};
function psv(){$("psaved").innerHTML=PR.address||PR.name?`<b>✅ Saved details</b><br>👤 ${E(PR.name)}<br>📞 ${E(PR.phone)}<br>🏠 ${E(PR.address)}`:"<small>No details saved yet</small>"}
let OL=[];const OPEN=new Set(),STEPS=[["Placed","Order placed","📝"],["Packed","Packed","📦"],["Out for Delivery","Out for delivery","🛵"],["Arrived","Arrived","📍"],["Delivered","Delivered","✅"]];
const ts=(o,k)=>{const t=k=="Placed"?o.createdAt:o.t?.[k];return t?.toDate?t.toDate().toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}):""};
const tl=o=>o.status=="Cancelled"?`<span class="tag" style="background:#c00">Cancelled ❌</span>`:STEPS.map(([k,l,ic],i)=>{const c=STEPS.findIndex(x=>x[0]==o.status);return `<div class="stp ${i<=c?"d":""} ${i==c?"c":""}"><span class="dot">${i<=c?"✓":""}</span><div>${ic} <b>${l}</b><br><small>${ts(o,k)}</small></div></div>`}).join("");
const etaL=o=>{if(!o.eta||["Delivered","Cancelled"].includes(o.status)||!o.createdAt?.toDate)return "";const t=new Date(o.createdAt.toDate().getTime()+o.eta*6e4);return `<div class="tag" style="display:inline-block;margin-top:8px;background:#2563eb">⏱ ~${t.toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"})} delivery by (${o.eta} min)</div>`};
function ro(){$("olist").innerHTML=OL.map(o=>{const op=OPEN.has(o.id),st=STEPS.find(x=>x[0]==o.status),d=o.createdAt?.toDate?o.createdAt.toDate().toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}):"";
 return `<div class="ord"><div class="oh"><div><b>Order #${E(o.id.slice(-6).toUpperCase())}</b><br><small>${d}</small></div><span class="tag"${o.status=="Cancelled"?' style="background:#c00"':""}>${st?st[1]:E(o.status)}</span></div>
 <div class="oi">${(o.items||[]).map(i=>`<div class="row"><span>${E(i.name)} × ${i.q}</span><span>₹${i.price*i.q}</span></div>`).join("")}</div>
 <div class="ot"><div class="row"><span>Subtotal</span><span>₹${o.subtotal??o.total}</span></div><div class="row"><span>Delivery</span><span>${o.fee?"₹"+o.fee:"Free"}</span></div><div class="row"><b>Total</b><b>₹${o.total}</b></div></div>
 <small>📍 ${E(o.address)}</small>${etaL(o)}<button class="otr" data-o="${o.id}">${op?"▲ Hide tracking":"▼ Track order"}</button>${op?`<div style="margin-top:12px">${tl(o)}</div>`:""}</div>`}).join("")||"<div class=\"box\">No orders yet</div>"}
function bind(u){uid=u.uid;seen={};setDoc(doc(db,"users",uid),{email:u.email||"",gname:u.displayName||""},{merge:true}).catch(()=>{});if(window.RID)updateDoc(doc(db,"visitors",window.RID),{reg:true}).catch(()=>{});if(typeof Notification!="undefined"&&Notification.permission==="granted")window.pushOn(true);un.forEach(f=>f());un=[
 onSnapshot(query(collection(db,"orders"),where("uid","==",uid)),s=>{
  const l=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||9e9)-(a.createdAt?.seconds||9e9));
  l.forEach(o=>{if(seen[o.id]&&seen[o.id]!==o.status)toast(`Order status: ${o.status}`);seen[o.id]=o.status});
  OL=l;if(!OPEN.size&&l[0])OPEN.add(l[0].id);ro()},()=>{}),
 onSnapshot(doc(db,"users",uid),s=>{PR=s.data()||{};$("pn").value=PR.name||auth.currentUser?.displayName||"";$("pph").value=PR.phone||"";$("pad").value=PR.address||"";
  if(!$("nm").value)$("nm").value=PR.name||auth.currentUser?.displayName||"";if(!$("ph").value)$("ph").value=PR.phone||"";if(!$("ad").value)$("ad").value=PR.address||"";psv()},()=>{})];acc();applyPA();
 if(!nb){nb=1;onSnapshot(query(collection(db,"notifications"),orderBy("createdAt","desc"),limit(1)),s=>{
  s.docChanges().forEach(c=>{const d=c.doc.data();if(c.type==="added"&&d.createdAt&&d.createdAt.toMillis()>t0)toast(d.title+": "+d.body)})},()=>{})}}
try{const rid=localStorage.rid||(localStorage.rid=crypto.randomUUID());window.RID=rid;
 if(!sessionStorage.v){sessionStorage.v=1;updateDoc(doc(db,"visitors",rid),{last:serverTimestamp(),visits:increment(1)}).catch(()=>setDoc(doc(db,"visitors",rid),{first:serverTimestamp(),last:serverTimestamp(),visits:1,reg:false}).catch(()=>{}))}}catch(e){}
draw();drawCart();psv();
onSnapshot(collection(db,"products"),s=>{P=s.docs.map(d=>({id:d.id,...d.data()}));Object.keys(cart).forEach(id=>{const f=P.find(x=>x.id==id);if(!f||oos(f))delete cart[id];else Object.assign(cart[id],f,{q:cart[id].q})});draw();drawCart();hideL();applyPA();if(PDID)pdraw()},e=>{hideL();err("Could not load products: "+e.message+" (check Firestore Rules)")});
onSnapshot(doc(db,"settings","store"),s=>{const d=s.data()||{};FEE=d.fee||0;FREE=d.freeAbove||0;ETA=d.eta||0;$("eta").style.display=ETA?"block":"none";$("eta").innerHTML=`🕒 Delivery in <b>~${ETA} minutes</b> ⚡`;drawCart()},()=>{});
onAuthStateChanged(auth,u=>{if(u)bind(u);else{uid=null;un.forEach(f=>f());un=[];OL=[];$("olist").innerHTML='<div class="box">Log in to see your orders<br><br><a class="btn lnk" href="login.html">Login</a></div>';acc()}});
</script></body></html>
