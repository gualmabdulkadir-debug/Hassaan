 async blk(d){const u=D.users.find(x=>x.id==d.id),s=u.status=="blocked"?"active":"blocked";await updateDoc(doc(db,"users",u.id),{status:s});if(s=="blocked"&&u.role=="seller")for(const p of D.products.filter(p=>p.sellerId==u.id))await updateDoc(doc(db,"products",p.id),{status:"pending"})},
 async delu(d){const u=D.users.find(x=>x.id==d.id);if(!confirm("Delete "+(u.rname||u.name)+"? This cannot be undone."))return;if(u.role=="seller")for(const p of D.products.filter(p=>p.sellerId==u.id))await deleteDoc(doc(db,"products",p.id));await deleteDoc(doc(db,"users",u.id));toast("Deleted")},
 async bulk(){const has=new Set(D.orders.map(o=>o.customerId)),l=D.users.filter(u=>u.role=="customer"&&!has.has(u.id));if(!confirm("Delete "+l.length+" visitors who never ordered?"))return;for(const u of l)await deleteDoc(doc(db,"users",u.id));toast("Cleaned up")},
 async draft(){const v=await wcollect();await setDoc(doc(db,"settings","draft"),v);DR=v;toast("Draft saved");render(1)},
 async live(){const v=await wcollect();await setDoc(doc(db,"settings","draft"),v);await setDoc(doc(db,"settings","site"),v);DR=v;toast("Published. Your site is updated");render(1)},
 async rmimg(d){const v={...(DR||SITE),[d.k]:""};await setDoc(doc(db,"settings","draft"),v);await setDoc(doc(db,"settings","site"),v);DR=v;render(1)},
 async fees(){const g=i=>+$("#"+i).value;await setDoc(doc(db,"settings","fees"),{pct:g("fp"),perKm:g("fk"),min:g("fm"),maxKm:g("fr"),prep:g("fq"),minPerKm:g("fv"),cod:g("fcod"),payUrl:$("#fpu").value.trim()});toast("Saved")}};
async function payNow(tx,amt){const r=await fetch(F.payUrl+"/start",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({txnid:tx,amount:amt,firstname:((me.rname||me.name||"").replace(/[^\w ]/g,"")||"Customer"),email:me.email||"customer@hassandigitalpoint.xyz",phone:me.phone})}).then(x=>x.json());
 const fm=document.createElement("form");fm.method="POST";fm.action=r.action;for(const[k,v]of Object.entries(r.fields)){const i=document.createElement("input");i.type="hidden";i.name=k;i.value=v;fm.appendChild(i)}document.body.appendChild(fm);fm.submit()}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b||!A[b.dataset.a])return;try{await A[b.dataset.a](b.dataset,b)}catch(x){toast(x.message)}});
document.addEventListener("change",async e=>{const s=e.target,c=s.dataset.c;if(s.name=="pm"){keep();pm=s.value;return render(1)}
 if(c=="cat")return attrsUI(s.value);if(c=="ofil"){ofil=s.value;return render(1)}if(c=="cshow"){cshow=s.value;return render(1)}
 if(c=="assign"&&s.value){const u=D.users.find(x=>x.id==s.value);try{await updateDoc(doc(db,"orders",s.dataset.id),{boyId:u.id,boyName:u.name,status:"assigned"})}catch(x){toast(x.message)}}});
document.addEventListener("keydown",e=>{if(e.key!="Enter")return;const i=e.target.id;if(i=="sq")A.search();if(i=="cq")A.csearch();if(i=="pw")A.login().catch(x=>toast(x.message))});

async function boot(u){let s=await getDoc(doc(db,"users",u.uid));
 if(!s.exists()&&u.isAnonymous){await setDoc(doc(db,"users",u.uid),{name:"Customer",email:"",role:"customer",status:"active",address:"",phone:"",createdAt:serverTimestamp()});s=await getDoc(doc(db,"users",u.uid))}
 if(!s.exists()||s.data().status!="active"){toast("This account is not active. Contact the store admin.");return signOut(auth)}
 me={id:u.uid,...s.data(),guest:u.isAnonymous};lv=false;cv="shop";tab="";const r=me.role;
 if(r=="admin")subs.push(onSnapshot(doc(db,"settings","draft"),x=>{DR=x.exists()?x.data():null},()=>{}));
 subs.push(onSnapshot(doc(db,"settings","fees"),x=>{if(x.exists())F={...F,...x.data()};render()},()=>{}));
 if(r=="customer"){sub(query(collection(db,"products"),where("status","==","approved")),"products");sub(query(collection(db,"orders"),where("customerId","==",me.id)),"orders");sub(query(collection(db,"users",me.id,"history"),orderBy("t","desc"),limit(40)),"hist")}
 if(r=="seller"){sub(query(collection(db,"products"),where("sellerId","==",me.id)),"products");sub(query(collection(db,"orders"),where("sellerId","==",me.id)),"orders")}
 if(r=="delivery")sub(query(collection(db,"orders"),where("boyId","==",me.id)),"orders");
 if(r=="admin"){sub(collection(db,"products"),"products");sub(collection(db,"orders"),"orders");sub(collection(db,"users"),"users")}
 render(1)}
onAuthStateChanged(auth,u=>{subs.forEach(f=>f());subs=[];seen={};me=null;D={products:[],orders:[],users:[],hist:[]};
 if(!u){$("#app").innerHTML='<p class="mu">Loading...</p>';signInAnonymously(auth).catch(e=>{loginV();toast("Guest access is off. Enable Anonymous sign-in in Firebase Authentication ("+e.code+")")})}else boot(u)});
onSnapshot(doc(db,"settings","site"),x=>site(x.exists()?x.data():{}),()=>{});
{const q=new URLSearchParams(location.search).get("pay");if(q)setTimeout(()=>toast(q=="ok"?"Payment successful. The store will confirm your order shortly.":"Payment was not completed. Please try again."),900)}
