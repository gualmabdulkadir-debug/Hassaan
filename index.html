 <!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hassaan Digital Point</title>
<style>
:root{--bg:#f1f3f6;--cd:#fff;--tx:#212121;--mu:#878787;--ac:#2874f0;--bd:#e8e1d6;--ok:#2b8a3e;--bad:#c92a2a}
@media(prefers-color-scheme:dark){:root{--bg:#17140f;--cd:#221e17;--tx:#f3ede3;--mu:#a59d8f;--bd:#373126;--ac:#4d8ff5}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans Devanagari",sans-serif}
header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--ac);color:#fff;position:sticky;top:0;z-index:5}
main{padding:16px;max-width:1000px;margin:auto}a{color:var(--ac);cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px}
.em{font-size:42px;text-align:center}.pr{font-weight:700;color:var(--ac)}.mu{color:var(--mu);font-size:13px}
button{border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px;border:0}
.b{background:var(--ac);color:#fff}.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
input,select,textarea{padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--cd);color:var(--tx);font-size:14px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.y{background:#ff9f00;color:#fff}.o{background:#fb641b;color:#fff}.y,.o{font-size:15px;padding:12px 18px;flex:1}
.gi{width:100%;height:140px;object-fit:contain}
.t2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;margin:6px 0}
</style></head><body>
<header><b id="ttl">🛍️ Hassaan Digital Point</b><span id="who"></span></header>
<main id="app"><p class="mu" style="text-align:center">Dukaan load ho rahi hai...</p></main>
<footer style="text-align:center;padding:20px" class="mu">Hassaan Digital Point © 2026</footer>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,addDoc,collection,query,where,onSnapshot,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const cfg={apiKey:"AIzaSyCWrKkSmgPXDt6KL7FNyMLZeI6kXd4ukU0",authDomain:"hassaan-s.firebaseapp.com",projectId:"hassaan-s",storageBucket:"hassaan-s.firebasestorage.app",messagingSenderId:"12302351650",appId:"1:12302351650:web:6c5a5c4ced2b210f79397b"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);

const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let me={role:"customer",id:"guest",name:"Grahak"},D={products:[],orders:[]},sq="",showLogin=false,curP=null;

const cart=()=>JSON.parse(localStorage["c_"+me.id]||"[]"),setCart=a=>{localStorage["c_"+me.id]=JSON.stringify(a);render()};

function render(){
 if(showLogin){loginV();return}
 $("#who").innerHTML=me.id=="guest"?`<button class=g style="color:#fff;border-color:#fff" data-a=openlogin>🔑 Login</button>`:`${esc(me.name)} (${me.role}) <button class=g style="color:#fff;border-color:#fff" data-a=out>Logout</button>`;
 $("#app").innerHTML={customer:vC,admin:vA,seller:vS,delivery:vD}[me.role]();
}

function loginV(){
 $("#who").innerHTML=`<button class=g style="color:#fff;border-color:#fff" data-a=closelogin>← Store Par Wapas</button>`;
 $("#app").innerHTML=`<div class=card style="max-width:360px;margin:30px auto">
  <h2>Seller / Admin Login</h2>
  <div class=row><input id=em placeholder="Email"></div>
  <div class=row><input id=pw type=password placeholder="Password"></div>
  <div class=row><button class=b data-a=login style="width:100%">Login Karein</button></div>
 </div>`;
}
 function vC(){
 if(curP){
  const p=D.products.find(x=>x.id==curP);
  if(!p)curP=null;
  else return `<button class=g data-a=back>← Wapas</button>
  <div class=card style="margin-top:10px">
   <div class=em>${esc(p.emoji||"📦")}</div>
   <h2>${esc(p.name)}</h2>
   <div class=pr style="font-size:22px">₹${p.price}</div>
   <p class=mu>${esc(p.desc||"Koi description nahi hai")}</p>
   <div class=row><button class=y data-a=add data-id=${p.id}>🛒 Cart me jodein</button></div>
  </div>`;
 }
 const ps=D.products.filter(p=>p.name.toLowerCase().includes(sq.toLowerCase())),C=cart().map(id=>D.products.find(p=>p.id==id)).filter(Boolean);
 return `<div class=row><input id=sq value="${esc(sq)}" placeholder="Samaan khojein..." style="flex:1"><button class=b data-a=search>Search</button></div>
 <h2>🛍️ Sabhi Samaan (Firebase Store)</h2>
 <div class=grid>${ps.map(p=>`<div class=card data-a=view data-id=${p.id} style="cursor:pointer">
  <div class=em>${esc(p.emoji||"📦")}</div>
  <div class=t2><b>${esc(p.name)}</b></div>
  <div class=pr>₹${p.price}</div>
 </div>`).join("")||'<p class=mu>Dukaan me abhi koi samaan nahi hai ya load ho raha hai...</p>'}</div>
 <h2 id=cartbox>🧺 Cart (${C.length})</h2>
 <div class=card>${C.map((p,i)=>`<div class=row>${esc(p.emoji\vert{}\vert{}"📦")} ${esc(p.name)} — <b>₹${p.price}</b> <button class=g data-a=rm data-i=${i}>Hatayein</button></div>`).join("")||'<span class=mu>Cart khali hai</span>'}
 ${C.length?`<hr><b>Total: ₹${C.reduce((a,b)=>a+b.price,0)}</b>
 <h3>Order karne ke liye pata bharein:</h3>
 <div class=row><input id=rn placeholder="Naam *"><input id=ph placeholder="Mobile Number *"></div>
 <div class=row><input id=ad placeholder="Pura Pata (Makan no, Gali) *"></div>
 <div class=row><button class=o data-a=place style="width:100%">Order Karein (Cash on Delivery)</button></div>`:""}</div>`;
}

function vS(){
 return `<h2>Seller Dashboard</h2>
 <div class=card><h3>Naya Product Jodein</h3>
 <div class=row><input id=pn placeholder="Product ka naam *"><input id=pp type=number placeholder="Keemat ₹ *"></div>
 <div class=row><input id=pe placeholder="Emoji (e.g. 📱, 👕) *"><input id=pd placeholder="Chota Vivran"></div>
 <button class=b data-a=addp style="margin-top:8px">Product Jodein</button></div>
 <h3>Aapke Products</h3>
 <div class=card>${D.products.filter(p=>p.sellerId==me.id).map(p=>`<div class=row>${esc(p.emoji)} ${esc(p.name)} - ₹${p.price}</div>`).join("")||'<p class=mu>Koi product nahi joda</p>'}</div>`;
}

function vA(){
 return `<h2>Admin Panel</h2><div class=card>Total Products: ${D.products.length} | Total Orders: ${D.orders.length}</div>`;
}

function vD(){
 return `<h2>Delivery Boy Panel</h2><div class=card>Assigned Orders dikhenge</div>`;
}

const A={
 async login(){
  try{
   const u=await signInWithEmailAndPassword(auth,$("#em").value.trim(),$("#pw").value);
   const s=await getDoc(doc(db,"users",u.user.uid));
   if(s.exists()){me={id:u.user.uid,...s.data()};showLogin=false;render()}
   else alert("User record nahi mila");
  }catch(e){alert("Login me galti: "+e.message)}
 },
 openlogin(){showLogin=true;render()},
 closelogin(){showLogin=false;render()},
 out(){signOut(auth);me={role:"customer",id:"guest",name:"Grahak"};render()},
 search(){sq=$("#sq")?.value.trim()||"";render()},
 view(d){curP=d.id;render()},
 back(){curP=null;render()},
 add(d){setCart([...cart(),d.id]);alert("Cart me jod diya gaya ✅")},
 rm(d){const c=cart();c.splice(+d.i,1);setCart(c)},
 async place(){
  const rn=$("#rn").value.trim(),ph=$("#ph").value.trim(),ad=$("#ad").value.trim();
  if(!rn||!ph||!ad)return alert("Sabhi jankari bharein!");
  const C=cart().map(id=>D.products.find(p=>p.id==id)).filter(Boolean);
  await addDoc(collection(db,"orders"),{
   customerId:me.id,name:rn,phone:ph,addr:ad,
   items:C.map(p=>({name:p.name,price:p.price})),
   total:C.reduce((a,b)=>a+b.price,0),status:"placed",createdAt:serverTimestamp()
  });
  setCart([]);alert("Order safaltapoorvak ho gaya! ✅");
 },
 async addp(){
  const n=$("#pn").value.trim(),p=+$("#pp").value,e=$("#pe").value.trim()\vert{}\vert{}"📦",d=$("#pd").value.trim();
  if(!n||!p)return alert("Naam aur Keemat zaroori hai!");
  await addDoc(collection(db,"products"),{
   name:n,price:p,emoji:e,desc:d,sellerId:me.id,sellerName:me.name,status:"approved",createdAt:serverTimestamp()
  });
  alert("Product jod diya gaya! ✅");render();
 }
};

document.addEventListener("click",async e=>{
 const b=e.target.closest("[data-a]");
 if(!b)return;
 try{await A[b.dataset.a](b.dataset)}catch(x){alert(x.message)}
});

// Guest User ke liye pehle hi dukaan load ho jaye
onSnapshot(collection(db,"products"),s=>{
 D.products=s.docs.map(d=>({id:d.id,...d.data()}));
 render();
},e=>console.error("Products Load Error:",e));

onAuthStateChanged(auth,u=>{
 if(u){
  getDoc(doc(db,"users",u.uid)).then(s=>{
   if(s.exists()){me={id:u.uid,...s.data()};render()}
  });
  onSnapshot(collection(db,"orders"),s=>{D.orders=s.docs.map(d=>({id:d.id,...d.data()}));render()});
 }else{
  me={role:"customer",id:"guest",name:"Grahak"};
  render();
 }
});
</script></body></html>
