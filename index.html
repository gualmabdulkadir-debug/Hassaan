 <!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hassaan Digital Point</title>
  <style>
    :root { --ac: #2874f0; --bg: #f1f3f6; --cd: #ffffff; --tx: #212121; --mu: #878787; --bd: #e0e0e0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--tx); font-family: system-ui, sans-serif; }
    header { background: var(--ac); color: #fff; padding: 14px 16px; position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; }
    main { padding: 16px; max-width: 1000px; margin: auto; }
    .card { background: var(--cd); border: 1px solid var(--bd); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .em { font-size: 48px; text-align: center; }
    .pr { font-weight: bold; color: var(--ac); font-size: 16px; }
    .mu { color: var(--mu); font-size: 13px; }
    button { border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 13px; border: none; font-weight: bold; }
    .b { background: var(--ac); color: #fff; }
    .y { background: #ff9f00; color: #fff; width: 100%; margin-top: 8px; }
    .o { background: #25D366; color: #fff; width: 100%; padding: 12px; font-size: 16px; }
    input, select { padding: 9px; border: 1px solid var(--bd); border-radius: 8px; width: 100%; margin: 4px 0 10px 0; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .t2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 14px; font-weight: 600; margin: 6px 0; }
    .badge { background: #ff9f00; color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 12px; }
  </style>
</head>
<body>

<header>
  <b>🛍️ Hassaan Digital Point</b>
  <button class="b" style="background:#fff; color:var(--ac)" onclick="scrollCart()">🧺 Cart (<span id="cartCount">0</span>)</button>
</header>

<main>
  <div class="card">
    <div class="row">
      <input id="sq" placeholder="🔍 Samaan khojein..." onkeyup="filterProducts()">
    </div>
  </div>

  <h2>🛍️ Sabhi Samaan (Products)</h2>
  <div class="grid" id="productGrid"></div>

  <h2 id="cartSection" style="margin-top:24px;">🧺 Aapki Cart</h2>
  <div class="card">
    <div id="cartItems">
      <p class="mu">Cart abhi khali hai.</p>
    </div>
    <hr style="border:0; border-top:1px solid var(--bd); margin:12px 0;">
    <div style="font-size:18px; font-weight:bold;">Total: ₹<span id="cartTotal">0</span></div>

    <h3 style="margin-top:16px;">Delivery Ka Pata:</h3>
    <input id="custName" placeholder="Aapka Naam *">
    <input id="custPhone" placeholder="Mobile Number *" type="number">
    <input id="custAddr" placeholder="Pura Pata (Ghar no, Gali, Ilaka) *">
    
    <button class="o" onclick="placeOrderWhatsApp()">📱 WhatsApp Par Order Karein</button>
  </div>
</main>
<script>
  // 1. Aapke Products Ka Data (Aap yahan naye products jod/badal sakte hain)
  const PRODUCTS = [
    { id: 1, name: "Sample Mobile Cover", price: 199, emoji: "📱", desc: "Premium quality cover" },
    { id: 2, name: "Moringa Leaf Powder (100g)", price: 250, emoji: "🌿", desc: "Pure natural powder" },
    { id: 3, name: "Neem Powder (100g)", price: 150, emoji: "🍃", desc: "100% Organic" },
    { id: 4, name: "Attar / Non-Alcoholic Perfume", price: 299, emoji: "🧴", desc: "Long lasting fragrance" },
    { id: 5, name: "T-Shirt Premium", price: 399, emoji: "👕", desc: "Cotton comfortable wear" }
  ];

  // WhatsApp Number (Jis par customer ka order aayega)
  const MY_WHATSAPP_NUMBER = "919000000000"; // <-- Yahan apna WhatsApp number 91 ke saath dalo

  let cart = JSON.parse(localStorage.getItem("hdp_cart") || "[]");

  function renderProducts(list) {
    const grid = document.getElementById("productGrid");
    grid.innerHTML = list.map(p => `
      <div class="card">
        <div class="em">${p.emoji}</div>
        <div class="t2">${p.name}</div>
        <div class="pr">₹${p.price}</div>
        <div class="mu">${p.desc}</div>
        <button class="b y" onclick="addToCart(${p.id})">🛒 Cart Me Jodein</button>
      </div>
    `).join("") || '<p class="mu">Koi samaan nahi mila.</p>';
  }

  function filterProducts() {
    const q = document.getElementById("sq").value.toLowerCase();
    const filtered = PRODUCTS.filter(p => p.name.toLowerCase().includes(q));
    renderProducts(filtered);
  }

  function addToCart(id) {
    const item = PRODUCTS.find(p => p.id === id);
    if (item) {
      cart.push(item);
      saveCart();
      alert(item.name + " Cart me jod diya gaya ✅");
    }
  }

  function removeFromCart(index) {
    cart.splice(index, 1);
    saveCart();
  }

  function saveCart() {
    localStorage.setItem("hdp_cart", JSON.stringify(cart));
    renderCart();
  }

  function renderCart() {
    document.getElementById("cartCount").innerText = cart.length;
    const cartItems = document.getElementById("cartItems");
    const cartTotal = document.getElementById("cartTotal");

    if (cart.length === 0) {
      cartItems.innerHTML = '<p class="mu">Cart abhi khali hai.</p>';
      cartTotal.innerText = "0";
      return;
    }

    let total = 0;
    cartItems.innerHTML = cart.map((item, index) => {
      total += item.price;
      return `
        <div class="row" style="justify-content:space-between; margin-bottom:8px;">
          <span>${item.emoji} ${item.name} — <b>₹${item.price}</b></span>
          <button class="b" style="background:#c92a2a" onclick="removeFromCart(${index})">Hatayein</button>
        </div>
      `;
    }).join("");

    cartTotal.innerText = total;
  }

  function scrollCart() {
    document.getElementById("cartSection").scrollIntoView({ behavior: 'smooth' });
  }

  function placeOrderWhatsApp() {
    const name = document.getElementById("custName").value.trim();
    const phone = document.getElementById("custPhone").value.trim();
    const addr = document.getElementById("custAddr").value.trim();

    if (cart.length === 0) return alert("Cart khali hai!");
    if (!name || !phone || !addr) return alert("Kripya Naam, Mobile Number aur Pata bharein!");

    let total = 0;
    let itemList = cart.map((item, i) => {
      total += item.price;
      return `${i + 1}. ${item.name} - ₹${item.price}`;
    }).join("%0A");

    let msg = `*🛍️ Naya Order - Hassaan Digital Point*%0A%0A` +
              `*Grahak Ka Naam:* ${encodeURIComponent(name)}%0A` +
              `*Mobile:* ${encodeURIComponent(phone)}%0A` +
              `*Pata:* ${encodeURIComponent(addr)}%0A%0A` +
              `*Samaan List:*%0A${itemList}%0A%0A` +
              `*Kul Keemat (Total):* ₹${total}%0A%0A` +
              `_Kripya Order Confirm Karein!_`;

    window.open(`https://wa.me/${MY_WHATSAPP_NUMBER}?text=${msg}`, '_blank');
  }

  // Initial Load
  renderProducts(PRODUCTS);
  renderCart();
</script>
</body>
</html>
